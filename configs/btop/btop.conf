# btop - tracked settings only (defaults for everything else).
# The greyscale theme ships with the package; setup.sh copies it next to this
# file so the name resolves on every distro (paths differ between package managers).
color_theme = "greyscale.theme"
theme_background = False
truecolor = True
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
vim_keys = False
rounded_corners = True
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_ms = 1000
proc_sorting = "pid"
check_temp = True
show_coretemp = True
temp_scale = "celsius"
show_cpu_freq = True
clock_format = "%X"
mem_graphs = True
show_swap = True
swap_disk = True
show_disks = True
only_physical = True
use_fstab = True
show_io_stat = True
net_auto = True
net_sync = True
show_battery = True
show_battery_watts = True
log_level = "WARNING"
